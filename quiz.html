<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Quiz</title>
  <link rel="stylesheet" href="Administrator/administrator-css/dashboard-shared.css">
  <link rel="stylesheet" href="CBT-css/CBT-general.css">
  <link rel="stylesheet" href="CBT-css/CBT-header.css">
  <link rel="stylesheet" href="CBT-css/CBT-main.css">
  <link rel="stylesheet" href="CBT-css/CBT-footer.css">
  <link rel="stylesheet" href="CBT-css/CBT-question.css">
</head>
<body>
  <header class="header-nav">
   <div class="system-brand">
     <img class="logo-img" src="data/Arewa-cbt.png" alt="Arewa CBT logo">
     <div>Arewa CBT</div>
   </div>

   <div class="dashboard-title">
     <img src="data/admin-title-img.png" alt="Quiz screen icon">
     <div>CST/24/SWE/00036</div>
   </div>
    <div class="quiz-topbar">
   <div class="quiz-status">
     <span class="subject-pill">Mathematics</span>
     <span class="quiz-progress">
       Question <span class="question-progress">1</span> of <span 
class="total-questions">0</span>
     </span>
   </div>
   <div class="time-tracker">30:00</div>
 </div>
  </header>

  <main class="main-body">
     <div class="Questions-container">
       <div class="question-text-container">
         <div class="question-label">
           <span class="question-badge">Q<span class="question-number"></span></span>
         </div>
         <div class="question-text"></div>
       </div>

       <div class="option-goto-container">
         <div class="option-container">
           <label>
             <input type="radio" name="a" id="optA" value="A">
             <span class="optionA"></span>
           </label>
           <label>
             <input type="radio" name="a" id="optB" value="B">
             <span class="optionB"></span>
           </label>
           <label>
             <input type="radio" name="a" id="optC" value="C">
             <span class="optionC"></span>
           </label>
           <label>
             <input type="radio" name="a" id="optD" value="D">
             <span class="optionD"></span>
           </label>
         </div>
         <div class="goto-container"></div>
       </div>
     </div>

     <div class="nav-container">
       <button class="previous-button">Previous</button>
       <button class="next-button">Next</button>
       <button class="goto-button">Goto</button>
       <button class="submit-button">Submit</button>
     </div>
   </div>

   <div class="submit-notification"></div>
  </main>

  <footer class="footer">
   <div>Exam progress: in progress</div>
   <div>Student name: Sulaiman Mahmud Ibrahim</div>
  </footer>

  <script type="module" src="CBT-js/CBT.js"></script>
</body>
</html>
