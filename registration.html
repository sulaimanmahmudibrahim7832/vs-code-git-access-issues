<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="account-css/registration.css">
</head>
<body>
  <div class="Header">
  </div>
  <div class="main">
    <center>
        <div class="Registration-part">
    <!--<form>-->
      <fieldset>
        <legend>Registration </legend>
        <div class="registration-input">
          <div class="notification-container">
          warning here 
          </div>
           <div class="identity-input"> 
            <label>
              Name:
            </label>
              <input class="user-name" type="text" placeholder="Full name  ">
              <label>
                Email:
              </label>
              <input class="user-email" type="email" placeholder="email address">
            </div>
            <div class="password-input">
              <label>
                Create password:
              </label>
              <input class="create-password" type="password" placeholder="create password ">
              <label>
                Comfirm Password:
              </label>
              <input class="confirm-password" type="password" placeholder="confirm password">
            </div>
              <div class="E-message">
               <caption></caption>
            </div>
            <div class="action-container">
              <button class="next-button">
                    Next
              </button>
              <button class="back-button">
                Back
              </button>
            </div>
        </div>
        <div>
        <button class="register-button"> Register </button>
        </div>
         <div>
   You already have account login <a target="_self" href="/login.html">here</a>
 </div>
